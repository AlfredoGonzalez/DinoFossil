name: Deploy web (GitHub Pages)

on:
  push:
    branches: [claude/vibrant-meitner-qop6yc]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # Iconos subidos desde GitHub: recorta, reduce a 256 px y convierte a WebP solo para la web publicada.
      - name: Optimize icons
        run: pip install --quiet pillow && python3 scripts/optimize-icons.py
      - run: npm test
      - run: npm run typecheck
      - run: npm run lint
      - name: Export web build
        run: npx expo export --platform web
        env:
          EXPO_BASE_URL: /${{ github.event.repository.name }}
          CI: 1
      - name: SPA fallback for deep links
        run: |
          cp dist/index.html dist/404.html
          touch dist/.nojekyll
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
